<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love Chat - حقيقي</title>
<style>
body{font-family:Arial;background:#fff0f5;padding:15px;margin:0}
.card{background:#fff;padding:15px;border-radius:15px;margin:10px 0;box-shadow:0 2px 5px #0002}
input,button{width:100%;padding:13px;margin:6px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}
button{background:#ff2a6d;color:#fff;border:0;font-weight:bold;font-size:16px}
</style>
</head>
<body>
<h2>❤️ Love Chat - تعارف حقيقي</h2>
<div class="card">
<input id="name" placeholder="سميتك">
<input id="city" placeholder="مدينتك - مراكش">
<input id="age" placeholder="السن">
<button id="btn">سجل دابا و بان للناس</button>
</div>
<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDemo-1234567890",
  authDomain: "love-chat-demo.firebaseapp.com",
  projectId: "love-chat-demo",
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById('btn').onclick = async () => {
  const name = document.getElementById('name').value;
  const city = document.getElementById('city').value;
  const age = document.getElementById('age').value;
  if(!name) return alert('كتب سميتك');
  await addDoc(collection(db, "users"), {name, city, age, time: Date.now()});
  alert('تسجلتي! دابا كلشي كيشوفك');
};

onSnapshot(collection(db, "users"), (snap)=>{
  let html = '';
  snap.forEach(d=>{
    let u = d.data();
    html += `<div class="card"><b>${u.name}</b> - ${u.city} - ${u.age} سنة <button onclick="alert('قريبا تقدر تهضر مع ${u.name}')">هضر معاه</button></div>`;
  });
  document.getElementById('list').innerHTML = html;
});
</script>
</body>
</html>
