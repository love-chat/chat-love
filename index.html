<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KMR MHMD Chat</title>
<style>
body{margin:0;font-family:sans-serif;background:#111;color:#fff;display:flex;flex-direction:column;height:100vh}
header{background:#ff006a;padding:15px;text-align:center;font-weight:bold}
#chat{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.m{max-width:75%;padding:10px 14px;border-radius:15px}
.me{align-self:flex-end;background:#ff006a}
.you{align-self:flex-start;background:#333}
#bar{display:flex;padding:10px;background:#000;gap:8px}
input{flex:1;padding:12px;border-radius:20px;border:none;background:#222;color:#fff}
button{padding:12px 18px;border-radius:20px;border:none;background:#ff006a;color:#fff}
</style>
</head>
<body>
<header>K.M.R ❤ M.H.M.D</header>
<div id="chat"></div>
<div id="bar">
<input id="t" placeholder="كتبي هنا...">
<button onclick="send()">Send</button>
</div>
<script>
let a=JSON.parse(localStorage.getItem('c')||'[]');
function show(){let c=document.getElementById('chat');c.innerHTML='';a.forEach(x=>{let d=document.createElement('div');d.className='m '+(x.m?'me':'you');d.textContent=x.t;c.appendChild(d)});c.scrollTop=9999}
function send(){let i=document.getElementById('t');if(!i.value)return;a.push({t:i.value,m:true});localStorage.setItem('c',JSON.stringify(a));i.value='';show()}
show();
</script>
</body>
</html>
