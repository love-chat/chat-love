<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Love</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>
body{margin:0;font-family:Arial;background:#fff}
#login{position:fixed;inset:0;background:#00d1b2;display:flex;align-items:center;justify-content:center;z-index:9999}
.box{background:#fff;padding:20px;border-radius:12px;width:90%;max-width:320px}
.box input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
.box button{width:100%;padding:12px;background:#00d1b2;color:#fff;border:0;border-radius:8px;font-weight:bold;font-size:16px}
.header{background:#00d1b2;color:#fff;padding:14px;text-align:center;font-weight:bold}
.user{padding:12px;border-bottom:1px solid #eee;display:flex;gap:10px;align-items:center}
.user img{width:48px;height:48px;border-radius:50%}
#chatPage{display:none;flex-direction:column;height:100vh}
#msgs{flex:1;overflow:auto;padding:10px;background:#f0f0f0}
.msg{padding:10px 14px;border-radius:15px;margin:6px 0;max-width:70%;display:inline-block}
.me{background:#00d1b2;color:#fff;float:left;clear:both}
.other{background:#fff;float:right;clear:both}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h3 style="text-align:center;color:#00d1b2;margin:0 0 10px">Chat Love ❤️</h3>
    <input id="n" placeholder="سميتك">
    <input id="a" placeholder="العمر" type="number">
    <input id="c" placeholder="المدينة">
    <button onclick="enter()">دخول</button>
    <p style="font-size:11px;color:#999;text-align:center;margin-top:10px">سيتم الحفظ وسيظهر لك الأشخاص المتصلين</p>
  </div>
</div>

<div id="listPage">
  <div class="header">الأشخاص القريب منك 🟢</div>
  <div id="users" style="padding:20px;text-align:center;color:#999">جاري التحميل...</div>
</div>

<div id="chatPage">
  <div class="header"><span onclick="back()" style="float:right;cursor:pointer">→ رجوع</span> <span id="chatName"></span></div>
  <div id="msgs"></div>
  <div style="padding:10px;display:flex;gap:6px;background:#fff"><input id="txt" style="flex:1;padding:11px;border-radius:20px;border:1px solid #ddd" placeholder="كتب رسالة..."><button onclick="send()" style="background:#00d1b2;color:#fff;border:0;padding:10px 18px;border-radius:20px">سيفط</button></div>
</div>

<script>
// Firebase ديالك
const firebaseConfig = {
  apiKey: "AIzaSyBdPT-VStQgY6HfOwaa9w4AT1HlGmYfaso",
  authDomain: "chat-love-14788.firebaseapp.com",
  projectId: "chat-love-14788",
  storageBucket: "chat-love-14788.firebasestorage.app",
  messagingSenderId: "663137842500",
  appId: "1:663137842500:web:d11aa94ec2704cbe271311"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let me=null, to=null;

function enter(){
 let name=document.getElementById("n").value.trim();
 if(!name){alert("كتب سميتك"); return;}
 me={name, age:document.getElementById("a").value||"20", city:document.getElementById("c").value||"المغرب"};
 localStorage.setItem("me",JSON.stringify(me));
 document.getElementById("login").style.display="none";
 db.collection("online").doc(name).set({name:me.name, age:me.age, city:me.city, ts:Date.now()}).then(()=>{load();}).catch(e=>{alert("Firebase error: "+e.message); load();});
}

let saved=localStorage.getItem("me");
if(saved){
  me=JSON.parse(saved);
  document.getElementById("login").style.display="none";
  load();
}

function load(){
 db.collection("online").onSnapshot(s=>{
   let h="";
   s.forEach(d=>{
     let u=d.data();
     if(u.name===me.name) return;
     h+=`<div class="user" onclick="openChat('${u.name}')"><img src="https://i.pravatar.cc/100?u=${u.name}"><div><b>${u.name}</b> - ${u.age} سنة<br><small>${u.city}</small></div><small style="margin-right:auto;color:#00d1b2">متصل 🟢</small></div>`;
   });
   document.getElementById("users").innerHTML=h||"<div style='padding:30px'>ما كاين حد دابا<br>حل الموقع فتيليفون آخر بنفس الرابط<br><b>love-chat.github.io</b><br>وغادي يبان هنا</div>";
 }, err=>{
   document.getElementById("users").innerHTML="خطأ Firebase: "+err.message+"<br>سير لـ Firestore Rules ودير allow read,write";
 });
}

function openChat(name){to=name; document.getElementById("listPage").style.display="none"; document.getElementById("chatPage").style.display="flex"; document.getElementById("chatName").textContent=name; listen();}
function back(){document.getElementById("chatPage").style.display="none"; document.getElementById("listPage").style.display="block";}
function listen(){
 db.collection("private").orderBy("ts").onSnapshot(s=>{
   let h="";
   s.forEach(d=>{
     let m=d.data();
     if((m.from===me.name && m.to===to) || (m.from===to && m.to===me.name)){
       let cls=m.from===me.name?"me":"other";
       h+=`<div class="msg ${cls}">${m.text}</div>`;
     }
   });
   let box=document.getElementById("msgs"); box.innerHTML=h; box.scrollTop=box.scrollHeight;
 });
}
function send(){
 let t=document.getElementById("txt").value.trim();
 if(!t||!to) return;
 db.collection("private").add({from:me.name,to:to,text:t,ts:Date.now()});
 document.getElementById("txt").value="";
}
</script>
</body>
</html>
