<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat-Love</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head><body>
<h2>Chat-Love ❤️</h2>
<input id="myName" placeholder="سميتك">
<div id="grid"></div>
<input id="txt" placeholder="كتب رسالة"><button onclick="send()">سيفط</button>
<div id="box"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBdPT-VStQgY6HfOwaa9w4AT1HlGmYfaso",
  authDomain: "chat-love-14788.firebaseapp.com",
  projectId: "chat-love-14788",
  storageBucket: "chat-love-14788.firebasestorage.app",
  messagingSenderId: "663137842500",
  appId: "1:663137842500:web:d11aa94ec2704cbe271311"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
function send(){
  let t=document.getElementById('txt').value;
  let n=document.getElementById('myName').value||"مجهول";
  db.collection("chat").add({name:n,text:t,time:Date.now()});
}
db.collection("chat").orderBy("time").onSnapshot(s=>{
  let h=""; s.forEach(d=>{h+=`<div><b>${d.data().name}:</b> ${d.data().text}</div>`});
  document.getElementById('box').innerHTML=h;
});
</script></body></html>
