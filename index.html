<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat-Love</title><style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui;background:#fff5f7}
.header{display:flex;align-items:center;gap:10px;padding:12px;background:#fff;position:sticky;top:0;box-shadow:0 2px 10px #0001}
.logo{font-weight:900;font-size:22px}.tab{padding:10px 18px;border-radius:20px;border:0;font-weight:600}
.tab.active{background:#e83a8a;color:#fff}.tab.inactive{background:#f1f1f1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 12px #0001}
.card img{width:100%;height:220px;object-fit:cover}.info{padding:10px}
.btn{width:100%;padding:10px;border:0;border-radius:12px;background:#e83a8a;color:#fff;font-weight:700;margin-top:6px}
#messages{padding:12px;display:none}.msgRow{background:#fff;padding:12px;border-radius:12px;margin:8px 0}
input{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;margin:8px 0}
</style></head><body>
<div class="header">
<div class="logo">Chat-Love ❤️</div>
<button class="tab active" id="b1" onclick="show('decouvrir')">Découvrir</button>
<button class="tab inactive" id="b2" onclick="show('messages')">Messages</button>
</div>

<div id="decouvrir">
<div style="padding:12px"><input id="myName" placeholder="سميتك باش تبان للناس"><button class="btn" onclick="addMe()">سجل و بان فـ Découvrir</button></div>
<div class="grid" id="grid"></div>
</div>

<div id="messages">
<div id="chatList"></div>
<div style="display:flex;gap:6px"><input id="txt" placeholder="كتب رسالة..."><button onclick="send()" style="width:80px" class="btn">إرسال</button></div>
</div>

<script>
let users = JSON.parse(localStorage.getItem('loveUsers')||'[{"name":"Sara, 22 - Marrakech","img":"https://randomuser.me/api/portraits/women/44.jpg"},{"name":"Aya, 21 - Casa","img":"https://randomuser.me/api/portraits/women/65.jpg"},{"name":"Noura, 23 - Rabat","img":"https://randomuser.me/api/portraits/women/68.jpg"}]');
let messages = JSON.parse(localStorage.getItem('loveMsgs')||'[]');
let current = null;

function render(){
  document.getElementById('grid').innerHTML = users.map((u,i)=>`
    <div class="card"><img src="${u.img}"><div class="info"><b>${u.name}</b><button class="btn" onclick="openChat(${i})">هضر معاها</button></div></div>
  `).join('');
  document.getElementById('chatList').innerHTML = messages.map(m=>`<div class="msgRow"><b>${m.from}:</b> ${m.text}</div>`).join('');
  localStorage.setItem('loveUsers',JSON.stringify(users));
  localStorage.setItem('loveMsgs',JSON.stringify(messages));
}
function addMe(){
  let n = document.getElementById('myName').value; if(!n) return alert('كتب سميتك');
  users.unshift({name:n, img:"https://randomuser.me/api/portraits/men/32.jpg"}); render(); alert('تسجلتي! دابا كتبان للناس');
}
function openChat(i){ current=users[i].name; show('messages'); }
function send(){
  let t=document.getElementById('txt').value; if(!t) return;
  messages.push({from: localStorage.getItem('myName')||'أنا', text:t}); document.getElementById('txt').value=''; render();
}
function show(tab){
  document.getElementById('decouvrir').style.display=tab=='decouvrir'?'block':'none';
  document.getElementById('messages').style.display=tab=='messages'?'block':'none';
  document.getElementById('b1').className=tab=='decouvrir'?'tab active':'tab inactive';
  document.getElementById('b2').className=tab=='messages'?'tab active':'tab inactive';
}
render();
</script></body></html>
