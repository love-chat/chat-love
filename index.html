<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat Love</title><link rel="manifest" href="manifest.json"><style>@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap');*{margin:0;padding:0;box-sizing:border-box;font-family:Tajawal}body{background:#0a0a0f;color:#fff}.h{padding:15px 20px;display:flex;justify-content:space-between}.h h1{font-size:28px;font-weight:900}.st{padding:10px;display:flex;gap:10px;overflow:auto}.st .s{text-align:center;min-width:70px}.st .s .r{width:70px;height:70px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#ff2a6d,#a259ff)}.st .s img{width:100%;height:100%;border-radius:50%;border:3px solid #0a0a0f}.chat{margin:10px;background:#1c1c22;border-radius:18px;padding:12px;display:flex;gap:10px;align-items:center}.chat img{width:55px;height:55px;border-radius:50%}.chat b{font-size:16px}.chat .m{font-size:12px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{width:28px;height:28px;background:#ff7eb3;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-right:auto}#box{position:fixed;inset:0;background:#000;z-index:99;display:none;flex-direction:column}#box .bar{padding:12px;background:#1c1c22;display:flex;justify-content:space-between}#box iframe{flex:1;border:0;background:#fff}</style></head><body><div class="h"><h1>المحادثات</h1><div>🔍 ✏️</div></div><div style="text-align:center;color:#888;font-size:12px">موعد و تعارف • 12 متصل الآن</div><div class="st" id="st"></div><div id="list"></div><div id="box"><div class="bar"><span id="nm">Kamar</span><span onclick="document.getElementById('box').style.display='none'" style="background:#ff2a6d;padding:5px 12px;border-radius:20px">رجوع X</span></div><iframe src="https://tlk.io/chat-love-kamra"></iframe></div><script>const u=[{n:'Kamar',m:'مرحبا كيف حالك؟ 😊',t:'10:32',c:2,i:'https://i.pravatar.cc/150?img=5'},{n:'Zara',m:'أحب الصورة جميلة جدا ✨',t:'09:58',c:5,i:'https://i.pravatar.cc/150?img=9'},{n:'ليلى',m:'هل نلتقي للقهوة؟',t:'أمس',c:1,i:'https://i.pravatar.cc/150?img=8'},{n:'أميرة',m:'أرسلت لك الموقع 📍',t:'أمس',c:3,i:'https://i.pravatar.cc/150?img=23'},{n:'نور',m:'تمام أراك غدا!',t:'الثلاثاء',c:0,i:'https://i.pravatar.cc/150?img=10'},{n:'سارة',m:'شكرا لك نتكلم لاحقا 💕',t:'الثلاثاء',c:3,i:'https://i.pravatar.cc/150?img=16'}];let s=document.getElementById('st'),l=document.getElementById('list');u.forEach(x=>{s.innerHTML+=`<div class="s" onclick="openC('${x.n}')"><div class="r"><img src="${x.i}"></div><p>${x.n}</p></div>`;l.innerHTML+=`<div class="chat" onclick="openC('${x.n}')"><img src="${x.i}"><div><b>${x.n}</b><div class="m">${x.m}</div></div>${x.c?`<div class="badge">${x.c}</div>`:''}</div>`});function openC(n){document.getElementById('nm').innerText=n;document.getElementById('box').style.display='flex'}</script></body></html>
