<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>الأشخاص القريب منك</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<style>
*{box-sizing:border-box;font-family:Tahoma,Arial}
body{margin:0;background:#00d1b2}
.phone{max-width:420px;margin:0 auto;background:#fff;min-height:100vh;position:relative;box-shadow:0 0 20px rgba(0,0,0,0.3)}
.top{height:35px;background:#111;display:flex;align-items:center;padding:0 10px;color:#fff;font-size:13px;justify-content:space-between}
.top span{opacity:0.9}
.header{background:#5bc5bf;color:#fff;padding:12px 10px;display:flex;align-items:center;gap:10px}
.header h3{flex:1;margin:0;text-align:center;font-size:17px;font-weight:normal}
.header i{font-style:normal;font-size:22px;cursor:pointer}
.search-bar{background:#5bc5bf;padding:0 10px 10px;display:flex;align-items:center}
.search-bar input{flex:1;background:rgba(255,255,255,0.25);border:0;padding:8px 12px;border-radius:4px;color:#fff}
.search-bar input::placeholder{color:#fff}
.tabs{display:flex;background:#fff;border-bottom:1px solid #eee;font-size:14px}
.tabs div{flex:1;text-align:center;padding:12px 2px;color:#888;position:relative}
.tabs div.active{color:#5bc5bf;border-bottom:3px solid #5bc5bf}
.tabs .badge{background:#ff3b30;color:#fff;border-radius:50%;padding:1px 6px;font-size:11px;position:absolute;top:6px;margin-right:3px}
.user-row{display:flex;align-items:center;padding:12px 10px;background:#fff;border-bottom:1px solid #f5f5f5;cursor:pointer}
.user-row:active{background:#f9f9f9}
.user-row img{width:52px;height:52px;border-radius:50%;object-fit:cover;margin-left:10px}
.user-row .mid{flex:1}
.user-row .name{font-weight:bold;font-size:14px;color:#333}
.user-row .name span{font-weight:normal;background:#e0f7f6;color:#5bc5bf;font-size:11px;padding:2px 7px;border-radius:12px;margin-right:5px}
.user-row .msg{font-size:12px;color:#999;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.user-row .left{font-size:11px;color:#aaa;text-align:left;line-height:1.6}
#login{position:fixed;inset:0;background:#5bc5bf;z-index:100;display:flex;align-items:center;justify-content:center}
.login-box{background:#fff;width:85%;max-width:320px;padding:20px;border-radius:12px}
.login-box h2{text-align:center;color:#5bc5bf;margin:0 0 15px}
.login-box input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
.login-box button{width:100%;padding:12px;background:#5bc5bf;color:#fff;border:0;border-radius:8px;font-weight:bold;margin-top:10px;font-size:16px}

/* CHAT VIEW */
#chatPage{display:none;flex-direction:column;height:100vh}
#chatPage .header{justify-content:space-between}
.chat-area{flex:1;background:#fff;padding:10px;overflow:auto}
.bubble{display:flex;gap:7px;margin:10px 0;align-items:flex-end}
